<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Password Reset — ProxyData (mockup step 12)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: radial-gradient(1200px 600px at 50% -10%, #0e2a33 0%, #0a0e14 55%, #07090d 100%); }
  .glass { background: rgba(255,255,255,.04); backdrop-filter: blur(18px); border: 1px solid rgba(34,211,238,.18); }
  .glow { box-shadow: 0 0 40px rgba(34,211,238,.15); }
  .field { background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); }
  .field:focus { border-color: #22d3ee; outline: none; box-shadow: 0 0 0 2px rgba(34,211,238,.25); }
</style>
</head>
<body class="min-h-screen text-slate-200 flex items-center justify-center p-4">
<main class="w-full max-w-md space-y-6">
  <section class="glass glow rounded-2xl p-6 sm:p-8">
    <p class="text-xs font-semibold uppercase tracking-widest text-cyan-300">View 1 · <code>/user/forgot-password</code></p>
    <h1 class="mt-2 text-2xl font-bold text-white">Reset password</h1>
    <p class="mt-1 text-sm text-slate-400">We send a single-use sign-in link — no codes, no OTP.</p>
    <form class="mt-4 space-y-4" onsubmit="return false">
      <input type="email" placeholder="you@example.com" class="field w-full rounded-xl px-4 py-3 text-white placeholder-slate-500" />
      <button class="w-full rounded-xl bg-cyan-500 py-3 font-semibold text-black hover:bg-cyan-400">Send reset link</button>
    </form>
    <p class="mt-3 text-xs text-slate-500">Limited to 1 request per day per account.</p>
  </section>
  <section class="glass glow rounded-2xl p-6 sm:p-8">
    <p class="text-xs font-semibold uppercase tracking-widest text-cyan-300">View 2 · <code>/user/reset-password?token=…</code></p>
    <h1 class="mt-2 text-2xl font-bold text-white">Choose a new password</h1>
    <form class="mt-4 space-y-4" onsubmit="return false">
      <input type="password" placeholder="New password (min. 8)" class="field w-full rounded-xl px-4 py-3 text-white placeholder-slate-500" />
      <input type="password" placeholder="Confirm new password" class="field w-full rounded-xl px-4 py-3 text-white placeholder-slate-500" />
      <button class="w-full rounded-xl bg-cyan-500 py-3 font-semibold text-black hover:bg-cyan-400">Update password</button>
    </form>
    <p class="mt-3 text-xs text-slate-500">Link is single-use and expires. Mockup — no backend wired.</p>
  </section>
</main>
</body>
</html>
