<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard - ProxyData</title>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      :root {
        --bg-obsidian: #09090b;
        --accent-cyan: #06b6d4;
      }
      body {
        background-color: var(--bg-obsidian);
        color: #f4f4f5;
        font-family: "Inter", sans-serif;
      }
      .glass-panel {
        background: rgba(24, 24, 27, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .custom-select {
        background: rgba(9, 9, 11, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        width: 100%;
        transition: border-color 0.2s;
      }
      .custom-select:focus {
        border-color: #06b6d4;
      }
      .copy-input {
        display: flex;
        align-items: center;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 6px;
        overflow: hidden;
      }
      .copy-input input {
        flex: 1;
        background: transparent;
        border: none;
        color: #a1a1aa;
        font-family: monospace;
        font-size: 12px;
        padding: 10px 12px;
        outline: none;
        width: 100%;
      }
      .copy-input button {
        padding: 10px 14px;
        color: #06b6d4;
        background: rgba(6, 182, 212, 0.1);
        border-left: 1px solid rgba(255, 255, 255, 0.05);
        font-weight: 600;
        font-size: 12px;
        transition: background 0.2s;
      }
      .copy-input button:hover {
        background: rgba(6, 182, 212, 0.2);
      }
    </style>
  </head>
  <body class="antialiased min-h-screen flex flex-col">
    <nav
      class="sticky top-0 z-50 border-b border-white/5 bg-[#09090b]/90 backdrop-blur-md"
    >
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between"
      >
        <div class="font-bold text-xl tracking-tight text-white">ProxyData</div>
        <div class="flex items-center gap-4">
          <a
            href="v1_transactions.html"
            class="hidden sm:block text-sm text-zinc-400 hover:text-white transition-colors"
            >Transactions</a
          >
          <div
            class="w-8 h-8 rounded-full bg-zinc-800 cursor-pointer border border-white/10 overflow-hidden ml-2"
          >
            <img
              src="https://api.dicebear.com/7.x/avataaars/svg?seed=User"
              alt="Avatar"
            />
          </div>
        </div>
      </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
      <div
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 sm:mb-8 gap-4"
      >
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight">
            Proxy Dashboard
          </h1>
          <p class="text-sm text-zinc-400 mt-1">
            Manage your active plans and generate credentials.
          </p>
        </div>
        <div class="w-full sm:w-72">
          <label
            class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1"
            >Active Plan / Provider</label
          >
          <select
            class="custom-select border-cyan-500/50 bg-cyan-950/20 text-cyan-50 font-bold shadow-lg shadow-cyan-500/10 cursor-pointer"
          >
            <option>Datacenter (DataImpulse) - 6.64 GB</option>
            <option>Residential (DataImpulse) - 12.0 GB</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">
        <!-- Proxy Access Card -->
        <div
          class="glass-panel rounded-2xl p-6 relative overflow-hidden lg:col-span-1"
        >
          <div
            class="absolute top-0 right-0 bg-cyan-600 text-white text-[10px] font-bold px-3 py-1 rounded-bl-lg uppercase tracking-widest shadow-lg"
          >
            Datacenter
          </div>
          <h2 class="text-sm font-semibold text-white mb-4">Proxy Access</h2>
          <div class="space-y-3">
            <div
              class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-0"
            >
              <label class="w-20 text-xs text-zinc-400">Login:</label>
              <div class="copy-input flex-1">
                <input
                  type="text"
                  value="3d1679d0e86cd4e30374"
                  readonly
                /><button>COPY</button>
              </div>
            </div>
            <div
              class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-0"
            >
              <label class="w-20 text-xs text-zinc-400">Password:</label>
              <div class="copy-input flex-1">
                <input type="text" value="40c8680828f18ac8" readonly /><button>
                  COPY
                </button>
              </div>
            </div>
            <div
              class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-0"
            >
              <label class="w-20 text-xs text-zinc-400">Host:</label>
              <div class="copy-input flex-1">
                <input
                  type="text"
                  value="gw.dataimpulse.com"
                  readonly
                /><button>COPY</button>
              </div>
            </div>
            <div
              class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-0"
            >
              <label class="w-20 text-xs text-zinc-400">Port:</label>
              <div class="copy-input flex-1">
                <input type="text" value="823" readonly /><button>COPY</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Usage Card -->
        <div
          class="glass-panel rounded-2xl p-6 flex flex-col justify-between lg:col-span-1"
        >
          <div>
            <div class="flex justify-between items-center mb-4">
              <h2 class="text-sm font-semibold text-white">Usage</h2>
              <div
                class="flex bg-black/50 border border-white/5 rounded-md p-0.5"
              >
                <button
                  class="px-3 py-1 text-[10px] font-bold bg-zinc-700 text-white rounded shadow"
                >
                  GB
                </button>
                <button
                  class="px-3 py-1 text-[10px] font-medium text-zinc-400 hover:text-white rounded"
                >
                  MB
                </button>
              </div>
            </div>
            <div class="mt-6">
              <div class="text-xs text-zinc-400 mb-1">Traffic left:</div>
              <div class="text-4xl font-bold text-cyan-400">6.64 GB</div>
            </div>
          </div>
          <button
            class="w-full mt-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-bold rounded-lg transition-colors shadow-lg shadow-cyan-500/20"
          >
            Add GBs
          </button>
        </div>

        <!-- Quick Links -->
        <div class="glass-panel rounded-2xl p-6 lg:col-span-1">
          <h2 class="text-sm font-semibold text-white mb-4">Resources</h2>
          <div class="space-y-4 mt-6">
            <a
              href="v1_user_proxy_config.html"
              class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 transition-colors group"
            >
              <span
                class="text-sm font-semibold text-cyan-400 group-hover:text-cyan-300"
                >Open Configuration Generator</span
              >
              <span
                class="text-cyan-400 group-hover:translate-x-1 transition-transform"
                >→</span
              >
            </a>
            <a
              href="#"
              class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 transition-colors group"
            >
              <span class="text-sm font-medium text-zinc-300"
                >Manage IP Whitelist</span
              >
              <span
                class="text-zinc-500 group-hover:translate-x-1 transition-transform"
                >→</span
              >
            </a>
            <a
              href="#"
              class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 transition-colors group"
            >
              <span class="text-sm font-medium text-zinc-300"
                >API Documentation</span
              >
              <span
                class="text-zinc-500 group-hover:translate-x-1 transition-transform"
                >→</span
              >
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
