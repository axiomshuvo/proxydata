<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - ProxyData</title>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      :root {
        --bg-obsidian: #09090b;
        --accent-cyan: #06b6d4;
      }
      body {
        background-color: var(--bg-obsidian);
        color: #f4f4f5;
        font-family: "Inter", sans-serif;
      }
      .glass-panel {
        background: rgba(24, 24, 27, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .custom-input {
        background: rgba(9, 9, 11, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        width: 100%;
        transition: all 0.2s;
      }
      .custom-input:focus {
        border-color: #06b6d4;
        box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.5);
      }
      .btn-google {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        font-weight: 500;
        color: white;
        transition: background 0.2s;
      }
      .btn-google:hover {
        background: rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body
    class="antialiased min-h-screen flex flex-col items-center justify-center p-4 sm:p-6"
  >
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white tracking-tight">ProxyData</h1>
        <p class="text-zinc-400 mt-2 text-sm sm:text-base">
          Sign in to manage your proxies.
        </p>
      </div>
      <div class="glass-panel rounded-2xl p-6 sm:p-8 shadow-2xl">
        <form class="space-y-5" onsubmit="return false;">
          <div>
            <label
              class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2"
              >Email Address</label
            >
            <input
              type="email"
              class="custom-input"
              placeholder="admin@proxydata.com"
            />
          </div>
          <div>
            <label
              class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2"
              >Password</label
            >
            <input
              type="password"
              class="custom-input"
              placeholder="••••••••"
            />
          </div>
          <div class="flex justify-between items-center text-sm">
            <label
              class="flex items-center gap-2 cursor-pointer text-zinc-400 select-none"
            >
              <input
                type="checkbox"
                class="accent-cyan-500 w-4 h-4 bg-zinc-800 border-zinc-700 rounded"
              />
              Remember me
            </label>
            <a
              href="v1_password_reset.html"
              class="text-cyan-400 hover:text-cyan-300 transition-colors"
              >Forgot password?</a
            >
          </div>
          <button
            class="w-full mt-2 py-3.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition-colors shadow-lg shadow-cyan-500/20"
          >
            Sign In
          </button>

          <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-zinc-800"></div>
            <span
              class="flex-shrink-0 mx-4 text-zinc-500 text-xs uppercase font-bold tracking-wider"
              >Or continue with</span
            >
            <div class="flex-grow border-t border-zinc-800"></div>
          </div>

          <button type="button" class="btn-google">
            <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              />
            </svg>
            Google
          </button>
        </form>
        <div
          class="mt-6 text-center text-sm text-zinc-400 border-t border-white/5 pt-6"
        >
          Don't have an account?
          <a
            href="v1_signup.html"
            class="text-cyan-400 hover:text-cyan-300 font-medium transition-colors"
            >Create one</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
