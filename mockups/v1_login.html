<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Sign In — ProxyData (mockup step 10)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: radial-gradient(1200px 600px at 50% -10%, #0e2a33 0%, #0a0e14 55%, #07090d 100%); }
  .glass { background: rgba(255,255,255,.04); backdrop-filter: blur(18px); border: 1px solid rgba(34,211,238,.18); }
  .glow { box-shadow: 0 0 40px rgba(34,211,238,.15); }
  .field { background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); }
  .field:focus { border-color: #22d3ee; outline: none; box-shadow: 0 0 0 2px rgba(34,211,238,.25); }
</style>
</head>
<body class="min-h-screen text-slate-200 flex items-center justify-center p-4">
<main class="glass glow rounded-2xl w-full max-w-md p-6 sm:p-8">
  <div class="text-center mb-6">
    <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-cyan-500/15 text-cyan-300 text-xl font-bold border border-cyan-400/30">P</div>
    <h1 class="mt-3 text-2xl font-bold text-white">Welcome back</h1>
    <p class="text-sm text-slate-400">Sign in to manage your proxies</p>
  </div>
  <form class="space-y-4" onsubmit="return false">
    <div>
      <label class="text-sm text-slate-300" for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" class="field mt-1 w-full rounded-xl px-4 py-3 text-white placeholder-slate-500" />
    </div>
    <div>
      <label class="text-sm text-slate-300" for="pw">Password</label>
      <div class="relative">
        <input id="pw" type="password" placeholder="••••••••" class="field mt-1 w-full rounded-xl px-4 py-3 pr-12 text-white placeholder-slate-500" />
        <button type="button" onclick="document.getElementById('pw').type = document.getElementById('pw').type === 'password' ? 'text' : 'password'" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-cyan-300">SHOW</button>
      </div>
    </div>
    <p class="hidden rounded-xl border border-red-400/30 bg-red-500/10 px-4 py-2 text-sm text-red-300">Invalid email or password.</p>
    <button class="w-full rounded-xl bg-cyan-500 py-3 font-semibold text-black hover:bg-cyan-400 active:scale-[.99]">Sign In</button>
  </form>
  <button class="mt-3 w-full rounded-xl border border-white/10 bg-white/5 py-3 text-sm font-medium text-white hover:bg-white/10">Continue with Google</button>
  <div class="mt-5 flex items-center justify-between text-sm">
    <a href="v1_password_reset.html" class="text-cyan-300 hover:underline">Forgot password?</a>
    <a href="v1_signup.html" class="text-slate-300 hover:underline">Create account</a>
  </div>
  <p class="mt-4 text-center text-xs text-slate-500">Route: <code>/user/sign-in</code> · mockup — no backend wired</p>
</main>
</body>
</html>
