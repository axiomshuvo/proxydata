<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Users - ProxyData</title>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      :root {
        --bg-obsidian: #09090b;
        --accent-cyan: #06b6d4;
      }
      body {
        background-color: var(--bg-obsidian);
        color: #f4f4f5;
        font-family: "Inter", sans-serif;
      }
      .glass-panel {
        background: rgba(24, 24, 27, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .custom-input {
        background: rgba(9, 9, 11, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }
      .custom-input:focus {
        border-color: #06b6d4;
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
      }
      th {
        background: rgba(255, 255, 255, 0.02);
        text-align: left;
        padding: 12px 16px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #a1a1aa;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      td {
        padding: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 14px;
        color: #e4e4e7;
      }
      tr:last-child td {
        border-bottom: none;
      }
    </style>
  </head>
  <body class="antialiased min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav
      class="sticky top-0 z-50 border-b border-white/5 bg-[#09090b]/90 backdrop-blur-md"
    >
      <div
        class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between"
      >
        <div class="flex items-center gap-8">
          <div class="font-bold text-xl tracking-tight text-white">
            ProxyData
            <span
              class="text-cyan-400 text-sm ml-2 px-2 py-0.5 bg-cyan-500/10 rounded"
              >ADMIN</span
            >
          </div>
          <div class="hidden md:flex gap-6 text-sm font-medium text-zinc-400">
            <a href="#" class="hover:text-white transition-colors">Overview</a>
            <a href="#" class="text-white">Users</a>
            <a
              href="v1_admin_config.html"
              class="hover:text-white transition-colors"
              >Configuration</a
            >
          </div>
        </div>
      </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-8">
      <div class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight">
            User Management
          </h1>
          <p class="text-sm text-zinc-400 mt-1">
            Suspend users, manage balances, and rotate sessions.
          </p>
        </div>
        <div>
          <input
            type="text"
            class="custom-input w-64"
            placeholder="Search email or UserID..."
          />
        </div>
      </div>

      <div class="glass-panel rounded-2xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
          <table>
            <thead>
              <tr>
                <th>User</th>
                <th>Status</th>
                <th>Total Spent</th>
                <th>Datacenter Data</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <div class="font-medium text-white">johndoe@example.com</div>
                  <div class="text-xs text-zinc-500 mt-0.5">ID: usr_9x8f72</div>
                </td>
                <td>
                  <span
                    class="px-2 py-1 text-xs font-bold bg-green-500/10 text-green-400 border border-green-500/20 rounded-md"
                    >Active</span
                  >
                </td>
                <td>৳4,250</td>
                <td><span class="text-cyan-400 font-medium">12.4 GB</span></td>
                <td>
                  <div class="flex gap-2">
                    <button
                      class="px-3 py-1.5 text-xs font-bold bg-zinc-800 hover:bg-zinc-700 text-white rounded transition-colors"
                    >
                      Edit GB
                    </button>
                    <button
                      class="px-3 py-1.5 text-xs font-bold bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded transition-colors"
                    >
                      Suspend
                    </button>
                  </div>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="font-medium text-white">badactor@spam.com</div>
                  <div class="text-xs text-zinc-500 mt-0.5">ID: usr_2a1b9c</div>
                </td>
                <td>
                  <span
                    class="px-2 py-1 text-xs font-bold bg-red-500/10 text-red-400 border border-red-500/20 rounded-md"
                    >Suspended</span
                  >
                </td>
                <td>৳500</td>
                <td><span class="text-zinc-500 font-medium">0.0 GB</span></td>
                <td>
                  <div class="flex gap-2">
                    <button
                      class="px-3 py-1.5 text-xs font-bold bg-zinc-800 hover:bg-zinc-700 text-white rounded transition-colors"
                    >
                      Edit GB
                    </button>
                    <button
                      class="px-3 py-1.5 text-xs font-bold bg-zinc-800 hover:bg-zinc-700 text-white rounded transition-colors"
                    >
                      Restore
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </body>
</html>
