<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Admin Config — ProxyData (mockup step 15)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: radial-gradient(1200px 600px at 50% -10%, #0e2a33 0%, #0a0e14 55%, #07090d 100%); }
  .glass { background: rgba(255,255,255,.04); backdrop-filter: blur(18px); border: 1px solid rgba(34,211,238,.18); }
  .field { background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); }
  .field:focus { border-color: #22d3ee; outline: none; }
</style>
</head>
<body class="min-h-screen text-slate-200 p-4">
<main class="mx-auto w-full max-w-2xl pb-10">
  <header class="pt-4">
    <p class="text-xs font-semibold uppercase tracking-widest text-cyan-300">Admin · obscured path</p>
    <h1 class="text-2xl font-bold text-white">System configuration</h1>
    <p class="text-sm text-slate-400">Exact keys only — no free-form env editing from UI.</p>
  </header>
  <form class="glass mt-4 space-y-5 rounded-2xl p-6" onsubmit="return false">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div><label class="text-sm text-slate-300">pendingRequestExpiryDays</label><input type="number" value="7" class="field mt-1 w-full rounded-xl px-4 py-3 text-white" /></div>
      <div><label class="text-sm text-slate-300">affiliateMaxActiveCodes</label><input type="number" value="5" class="field mt-1 w-full rounded-xl px-4 py-3 text-white" /></div>
      <div><label class="text-sm text-slate-300">defaultCommissionPerGbBdt (৳)</label><input type="number" value="12" class="field mt-1 w-full rounded-xl px-4 py-3 text-white" /></div>
      <div><label class="text-sm text-slate-300">minimumOwnerProfitBdt (৳)</label><input type="number" value="5" class="field mt-1 w-full rounded-xl px-4 py-3 text-white" /></div>
    </div>
    <div>
      <h2 class="font-semibold text-white">Wholesale costPerGbBdt per pool</h2>
      <div class="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div><label class="text-sm text-slate-300">Residential (×1.0)</label><input type="number" value="40" class="field mt-1 w-full rounded-xl px-4 py-3 text-white" /></div>
        <div><label class="text-sm text-slate-300">Mobile (×2.0)</label><input type="number" value="80" class="field mt-1 w-full rounded-xl px-4 py-3 text-white" /></div>
        <div><label class="text-sm text-slate-300">Datacenter (×0.5)</label><input type="number" value="20" class="field mt-1 w-full rounded-xl px-4 py-3 text-white" /></div>
        <div><label class="text-sm text-slate-300">Premium Residential (×5.0)</label><input type="number" value="200" class="field mt-1 w-full rounded-xl px-4 py-3 text-white" /></div>
      </div>
    </div>
    <button class="w-full rounded-xl bg-cyan-500 py-3 font-semibold text-black hover:bg-cyan-400">Save configuration</button>
  </form>
  <p class="mt-4 text-xs text-slate-500">Admin path never displayed here. Mockup — no backend wired.</p>
</main>
</body>
</html>
