<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Settings — ProxyData (mockup step 13)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: radial-gradient(1200px 600px at 50% -10%, #0e2a33 0%, #0a0e14 55%, #07090d 100%); }
  .glass { background: rgba(255,255,255,.04); backdrop-filter: blur(18px); border: 1px solid rgba(34,211,238,.18); }
  .field { background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); }
  .field:focus { border-color: #22d3ee; outline: none; box-shadow: 0 0 0 2px rgba(34,211,238,.25); }
  .field:disabled { opacity: .5; }
</style>
</head>
<body class="min-h-screen text-slate-200 p-4">
<main class="mx-auto w-full max-w-md space-y-4 pb-10">
  <header class="pt-4 text-center">
    <h1 class="text-2xl font-bold text-white">Settings</h1>
    <p class="text-sm text-slate-400">Profile &amp; security</p>
  </header>
  <section class="glass rounded-2xl p-6">
    <h2 class="font-semibold text-white">Profile</h2>
    <div class="mt-4 flex items-center gap-4">
      <div class="flex h-14 w-14 items-center justify-center rounded-full bg-cyan-500/15 text-lg font-bold text-cyan-300 border border-cyan-400/30">TS</div>
      <div>
        <p class="text-sm font-medium text-white">Generated initials avatar</p>
        <p class="text-xs text-slate-500">Uploads disabled in v1 (512MB cap) — OAuth photo or initials only.</p>
      </div>
    </div>
    <div class="mt-4 space-y-3">
      <div>
        <label class="text-sm text-slate-300">Display name</label>
        <input value="Tanvir S." class="field mt-1 w-full rounded-xl px-4 py-3 text-white" />
      </div>
      <div>
        <label class="text-sm text-slate-300">Email (immutable)</label>
        <input value="tanvir@example.com" disabled class="field mt-1 w-full rounded-xl px-4 py-3 text-white" />
      </div>
      <button class="w-full rounded-xl bg-cyan-500 py-3 font-semibold text-black hover:bg-cyan-400">Save changes</button>
    </div>
  </section>
  <section class="glass rounded-2xl p-6">
    <h2 class="font-semibold text-white">Change password</h2>
    <p class="text-xs text-slate-500">Credential accounts must confirm the current password. OAuth users see “Set password” instead.</p>
    <div class="mt-3 space-y-3">
      <input type="password" placeholder="Current password" class="field w-full rounded-xl px-4 py-3 text-white placeholder-slate-500" />
      <input type="password" placeholder="New password" class="field w-full rounded-xl px-4 py-3 text-white placeholder-slate-500" />
      <button class="w-full rounded-xl border border-white/10 bg-white/5 py-3 font-medium text-white hover:bg-white/10">Update password</button>
    </div>
  </section>
  <p class="text-center text-xs text-slate-500">Route: <code>/profile</code> · mockup — no backend wired</p>
</main>
</body>
</html>
